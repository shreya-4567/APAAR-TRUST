<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <script>
      (function() {
        try {
          const stored = localStorage.getItem('trueroll_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#060D17] text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
